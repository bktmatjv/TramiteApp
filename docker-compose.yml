
services:
  # Base de Datos
  db:
    image: postgres:15-alpine
    container_name: edugestor_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-edugestor_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - edugestor_network

  # Backend (Spring Boot)
  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: edugestor_backend
    restart: always
    entrypoint: ["sh", "-c", "sleep 15 && java -jar app.jar"]
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-edugestor_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    networks:
      - edugestor_network

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edugestor_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - edugestor_network

volumes:
  db_data:

networks:
  edugestor_network:
    driver: bridge
